<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>qq DSH console · disconnected</title>
  <link rel="stylesheet" href="/qq/assets/console-v6.css">
  <script defer src="/qq/assets/reconnect-v1.js"></script>
</head>
<body>
  <header class="site-header"><a href="/qq/">qq / DSH</a><span>Disconnected</span></header>
  <main>
    <section class="session-panel offline-shell" aria-labelledby="offline-heading">
      <div class="session-heading">
        <div>
          <p class="eyebrow">Network required</p>
          <h1 id="offline-heading">DSH is unavailable</h1>
        </div>
        <p class="status status-stopped" role="status"><span class="status-dot" aria-hidden="true"></span><span class="status-label">Disconnected</span></p>
      </div>
      <div class="offline-message">
        <p>No transcript is cached and no message can be sent offline.</p>
        <p>Reconnect to the home PC, then <a href="/qq/">retry the live console</a>.</p>
      </div>
    </section>
  </main>
</body>
</html>
